name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check src tests examples
      - run: uv run --frozen pytest
      - run: uv run --frozen astral-desktop doctor
      - run: uv build
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth xclip python3-tk libx11-6 libxext6 libxrender1 libxtst6
      - run: uv sync --frozen --python 3.12
      - run: xvfb-run -a -s '-screen 0 1280x800x24' env ASTRAL_TEST_DESKTOP=1 uv run --frozen python tests/desktop_smoke.py
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate .claude-plugin/plugin.json
