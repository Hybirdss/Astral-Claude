[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astral-claude"
version = "0.2.0"
description = "Portable desktop tools and practical computer-use skills for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude-code", "mcp", "computer-use", "desktop-automation", "blender"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=1.26,<2", "mss>=10,<11", "Pillow>=11,<13",
  "PyAutoGUI>=0.9.54,<0.10", "pyperclip>=1.9,<2", "filelock>=3.16,<4",
]

[project.urls]
Homepage = "https://github.com/Hybirdss/Astral-Claude"
Repository = "https://github.com/Hybirdss/Astral-Claude"
Issues = "https://github.com/Hybirdss/Astral-Claude/issues"
Changelog = "https://github.com/Hybirdss/Astral-Claude/blob/main/CHANGELOG.md"

[project.scripts]
astral-desktop = "astral_claude.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/astral_claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
