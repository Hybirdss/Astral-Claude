[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astral-claude"
version = "0.1.0"
description = "Portable desktop tools and practical computer-use skills for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp>=1.26,<2", "mss>=10,<11", "Pillow>=11,<13",
  "PyAutoGUI>=0.9.54,<0.10", "pyperclip>=1.9,<2", "filelock>=3.16,<4",
]

[project.scripts]
astral-desktop = "astral_claude.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/astral_claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
